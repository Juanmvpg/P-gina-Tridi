<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../auth.js"></script>
    <title>¿Qué Falta?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../juegos.html" style="position: absolute; top: 20px; left: 20px; text-decoration: none; font-weight: bold; color: var(--text); background: var(--surface); padding: 10px 20px; border-radius: 12px; border: 4px solid var(--border); box-shadow: 0 4px 0 var(--border); cursor: pointer;">← Volver a Minijuegos</a>
    <div class="container">
        <h1>🔍 ¿Qué Falta? 🔎</h1>
        
        <div class="scoreboard">
            <div class="team" id="team1">
                <h2>Grupo 1</h2>
                <div class="score-container">
                    <button class="score-btn" onclick="adjustScore(1, -1)">-</button>
                    <span class="score" id="score1">0</span>
                    <button class="score-btn" onclick="adjustScore(1, 1)">+</button>
                </div>
            </div>
            <div class="team" id="team2">
                <h2>Grupo 2</h2>
                <div class="score-container">
                    <button class="score-btn" onclick="adjustScore(2, -1)">-</button>
                    <span class="score" id="score2">0</span>
                    <button class="score-btn" onclick="adjustScore(2, 1)">+</button>
                </div>
            </div>
            <div class="team" id="team3">
                <h2>Grupo 3</h2>
                <div class="score-container">
                    <button class="score-btn" onclick="adjustScore(3, -1)">-</button>
                    <span class="score" id="score3">0</span>
                    <button class="score-btn" onclick="adjustScore(3, 1)">+</button>
                </div>
            </div>
        </div>

        <div class="game-area">
            <h2 id="status-text">¡Haz clic en Jugar para empezar!</h2>
            <div class="emoji-container" id="emoji-display">
                <!-- Emojis will appear here -->
            </div>
            
            <div class="controls" id="controls">
                <button id="start-btn" onclick="startRound()">▶️ Jugar Ronda</button>
            </div>
            
            <div class="action-buttons hidden" id="action-buttons">
                <button class="btn-reveal" onclick="showAnswer()">✅ Mostrar Respuesta</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
